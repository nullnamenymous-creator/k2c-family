<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>

    <!-- Glass Bubble Primary Gradient -->
    <linearGradient id="glassGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0f4ff" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glass Bubble Secondary Gradient -->
    <linearGradient id="glassGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Filter for iOS Glass Drop Shadow -->
    <filter id="glassShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#001845" flood-opacity="0.35" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Specular Top Arc -->
  <path d="M 0,115 C 0,51.48 51.48,0 115,0 L 397,0 C 460.52,0 512,51.48 512,115 C 410,135 102,135 0,115 Z" fill="#ffffff" opacity="0.12" />

  <!-- Secondary Glass Bubble (Receiver - Frosted Glass) -->
  <g filter="url(#glassShadow)">
    <rect x="100" y="195" width="220" height="155" rx="42" fill="url(#glassGrad2)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.6" />
    <path d="M 125,350 L 105,375 C 98,382 86,375 88,365 L 94,345 Z" fill="url(#glassGrad2)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.6" />
    
    <!-- Receiver Bubble Dots (Typing Indicator/Family Chat) -->
    <circle cx="160" cy="272" r="11" fill="#ffffff" opacity="0.9" />
    <circle cx="210" cy="272" r="11" fill="#ffffff" opacity="0.9" />
    <circle cx="260" cy="272" r="11" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Primary Foreground Bubble (Sender - Solid Luminous iOS Glass) -->
  <g filter="url(#glassShadow)">
    <rect x="195" y="145" width="235" height="165" rx="44" fill="url(#glassGrad1)" stroke="#ffffff" stroke-width="3" />
    <path d="M 395,310 L 415,335 C 422,342 434,335 432,325 L 426,305 Z" fill="url(#glassGrad1)" stroke="#ffffff" stroke-width="3" />

    <!-- Family Heart / Connection Emblem inside bubble -->
    <path d="M 312,200 C 300,185 278,185 268,202 C 258,185 236,185 224,200 C 210,217 215,240 234,258 L 268,288 L 302,258 C 321,240 326,217 312,200 Z" fill="#007AFF" />
  </g>

  <!-- Glowing Online Status Orb -->
  <circle cx="395" cy="145" r="18" fill="#34C759" stroke="#ffffff" stroke-width="4" filter="url(#softGlow)" />
</svg>
